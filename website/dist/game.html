<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - OOP Arcade</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Header with game title -->
        <header class="game-header">
            <button class="back-btn" onclick="location.href='index.html'">←</button>
            <h1 id="game-title">Game Title</h1>
            <div class="header-actions">
                <button id="restart-btn" class="btn-secondary"> Restart</button>
            </div>
        </header>

        <!-- Game Setup Section -->
        <section id="setup-section" class="setup-section">
            <div class="setup-card">
                <h2>Game Setup</h2>
                
                <!-- Player 1 Setup -->
                <div class="player-setup">
                    <h3>Player 1 (X)</h3>
                    <input type="text" id="player1-name" placeholder="Enter name" value="Player 1">
                    <div class="player-type-selection">
                        <label>
                            <input type="radio" name="player1-type" value="human" checked>
                            <span>👤 Human</span>
                        </label>
                        <label>
                            <input type="radio" name="player1-type" value="smart">
                            <span>🤖 Smart AI</span>
                        </label>
                    </div>
                </div>

                <!-- Player 2 Setup -->
                <div class="player-setup">
                    <h3>Player 2 (O)</h3>
                    <input type="text" id="player2-name" placeholder="Enter name" value="Player 2">
                    <div class="player-type-selection">
                        <label>
                            <input type="radio" name="player2-type" value="human" checked>
                            <span>👤 Human</span>
                        </label>
                        <label>
                            <input type="radio" name="player2-type" value="smart">
                            <span>🤖 Smart AI</span>
                        </label>
                    </div>
                </div>

                <button id="start-game-btn" class="btn-primary">Start Game</button>
            </div>
        </section>

        <!-- Game Play Section -->
        <section id="game-section" class="game-section" style="display: none;">
            <!-- Game Info Bar -->
            <div class="game-info">
                <div class="player-info" id="player1-info">
                    <span class="player-name">Player 1</span>
                    <span class="player-symbol">X</span>
                    <span class="player-score" id="player1-score"></span>
                </div>
                <div class="turn-indicator" id="turn-indicator">
                    <span id="current-player">Player 1</span>'s Turn
                </div>
                <div class="player-info" id="player2-info">
                    <span class="player-name">Player 2</span>
                    <span class="player-symbol">O</span>
                    <span class="player-score" id="player2-score"></span>
                </div>
            </div>

            <!-- Additional Game Info (for special games like Numerical TTT) -->
            <div id="additional-info" class="additional-info"></div>

            <!-- Game Board Container -->
            <div id="board-container" class="board-container">
                <!-- Board will be dynamically generated by JavaScript -->
            </div>

            <!-- Game Messages -->
            <div id="game-message" class="game-message"></div>

            <!-- Input Area (for games requiring additional input like column number) -->
            <div id="input-area" class="input-area" style="display: none;">
                <input type="number" id="game-input" placeholder="Enter column (0-6)">
                <button id="submit-input" class="btn-primary">Submit</button>
            </div>
        </section>
    </div>

    <!-- Load base classes first -->
    <script src="js/base.min.js"></script>
    
    <!-- Load all game implementations -->
    <script src="js/games/tictactoe.min.js"></script>
    <script src="js/games/fourinarow.min.js"></script>
    <script src="js/games/numerical.min.js"></script>
    <script src="js/games/sus.min.js"></script>
    <script src="js/games/misere.min.js"></script>
    <script src="js/games/word.min.js"></script>
    <script src="js/games/4x4.min.js"></script>
    <script src="js/games/5x5.min.js"></script>
    <script src="js/games/obstacle.min.js"></script>
    <script src="js/games/diamond.min.js"></script>
    <script src="js/games/timed.min.js"></script>
    
    <!-- Load main game controller -->
    <script src="js/main.min.js"></script>
</body>
</html>
